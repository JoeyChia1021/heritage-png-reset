<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURELIA · Email verification</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9f5f0;color:#44352e;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;padding:20px}.card{width:min(100%,490px);border-radius:22px;background:white;border:1px solid #e7d9cc;box-shadow:0 15px 45px #54403113;padding:35px}h1{font:700 27px Georgia,serif;margin:15px 0}p{font-size:14px;line-height:1.6}.brand{letter-spacing:5px;color:#91715a;font-weight:900}.icon{border-radius:16px;background:#e9f3ec;color:#2e6842;padding:11px 15px;font-size:22px;display:inline-block}.error .icon{background:#fff0ed;color:#9a493b}a{display:block;margin-top:25px;padding:14px;text-align:center;color:white;background:#493a32;border-radius:13px;text-decoration:none;font-weight:800}</style></head><body><main class="card" id="card"><div class="brand">AURELIA</div><div class="icon" id="icon">✓</div><h1 id="heading">Confirming your email</h1><p id="message">Checking your confirmation link…</p><p id="back">You may now return to the AURELIA admin or vendor website and sign in again.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const card=document.getElementById('card'),msg=document.getElementById('message'),heading=document.getElementById('heading');
const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
function error(text){card.classList.add('error');document.getElementById('icon').textContent='!';heading.textContent='Verification needs attention';msg.textContent=text;}
try{const reason=query.get('error_description')||hash.get('error_description')||query.get('error')||hash.get('error');if(reason)throw Error(reason.replace(/\+/g,' '));
if(!hash.has('access_token')&&!query.has('code')&&!query.has('token_hash'))throw Error('This page must be opened from a fresh Supabase verification email.');
if(!window.supabase)throw Error('Verification library could not load. Check your internet connection.');
const client=window.supabase.createClient('https://bfdgzrgeybajylosxxxz.supabase.co','sb_publishable_ORst8Ln04c1HbWhWmXk5CQ_fsGqVtd_',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
if(hash.get('access_token')&&hash.get('refresh_token')){const {error:e}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(e)throw e;}
else if(query.get('code')){const {error:e}=await client.auth.exchangeCodeForSession(query.get('code'));if(e)throw e;}
else if(query.get('token_hash')){const {error:e}=await client.auth.verifyOtp({token_hash:query.get('token_hash'),type:'email_change'});if(e)throw e;}
const {data,error:authError}=await client.auth.getUser();if(authError||!data?.user)throw Error('We could not confirm this verification session. Open a fresh confirmation link.');
heading.textContent='Confirmation link verified';msg.textContent='Supabase accepted this confirmation. If confirmation is required at both email addresses, complete the other email too. Return to AURELIA and sign in with the verified login email.';
await client.auth.signOut();
}catch(e){error(e.message||'The link expired or was already used. Request another email change from Account Settings.');}
finally{history.replaceState(null,'',location.pathname);}
})();
</script></body></html>
