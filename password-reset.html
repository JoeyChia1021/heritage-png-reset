<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Heritage-PNG Password Recovery</title>
  <style>
    :root{--navy:#0f2d4a;--gold:#f4be55;--cream:#fffaf0;--muted:#6d7885;--green:#23865f;--red:#c84d4d;--border:#e7dfd1}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--navy)}
    .card{width:min(100%,460px);background:#fff;border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 16px 45px rgba(15,45,74,.10);text-align:center}
    .icon{width:82px;height:82px;margin:0 auto 18px;border-radius:999px;display:grid;place-items:center;background:rgba(244,190,85,.22);font-size:38px}
    h1{margin:0;font-size:26px;line-height:1.2} p{color:var(--muted);line-height:1.55}
    .status{margin-top:20px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#fafafa;font-weight:700}
    .success{color:var(--green);background:rgba(35,134,95,.08);border-color:rgba(35,134,95,.25)}
    .error{color:var(--red);background:rgba(200,77,77,.08);border-color:rgba(200,77,77,.25)}
    button{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:14px;background:var(--gold);color:var(--navy);font-size:16px;font-weight:800;cursor:pointer}
    button[hidden]{display:none}.small{margin-top:14px;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" id="icon">✉️</div>
    <h1 id="title">Verifying your email</h1>
    <p id="message">Please wait while Heritage-PNG confirms this password recovery link.</p>
    <div class="status" id="status">Checking verification...</div>
    <button id="openAppButton" hidden>Open Heritage-PNG</button>
    <p class="small">If you opened this link on another device, keep Heritage-PNG open on the original device. It will update automatically.</p>
  </main>
<script>
const VERIFY_FUNCTION_URL='https://agrspykrvoepewxgshth.supabase.co/functions/v1/password-reset-verify';
const pageUrl=new URL(window.location.href);
const requestId=pageUrl.searchParams.get('request_id');
const hash=new URLSearchParams(window.location.hash.startsWith('#')?window.location.hash.substring(1):window.location.hash);
const title=document.getElementById('title');
const message=document.getElementById('message');
const status=document.getElementById('status');
const icon=document.getElementById('icon');
const openAppButton=document.getElementById('openAppButton');
function showError(text){icon.textContent='!';title.textContent='Verification failed';message.textContent='The password recovery link could not be verified.';status.textContent=text;status.className='status error';openAppButton.hidden=true;}
function showSuccess(){icon.textContent='✓';title.textContent='Email verified successfully';message.textContent='You can now return to the Heritage-PNG device and create a new password.';status.textContent='Verification complete. The original device will update automatically.';status.className='status success';openAppButton.hidden=false;setTimeout(()=>{window.location.href='heritagepng://reset-password?request_id='+encodeURIComponent(requestId??'');},900);}
openAppButton.addEventListener('click',()=>{window.location.href='heritagepng://reset-password?request_id='+encodeURIComponent(requestId??'');});
async function verifyRecovery(){
  const errorDescription=hash.get('error_description')||hash.get('error');
  if(errorDescription){showError(decodeURIComponent(errorDescription));return;}
  const accessToken=hash.get('access_token'); const type=hash.get('type');
  history.replaceState(null,'',window.location.pathname+window.location.search);
  if(!requestId){showError('The password recovery request ID is missing.');return;}
  if(!accessToken){showError('The recovery token is missing or has expired. Please request a new password recovery email.');return;}
  if(type&&type!=='recovery'){showError('This link is not a password recovery link.');return;}
  try{
    const response=await fetch(VERIFY_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'confirm',request_id:requestId,access_token:accessToken})});
    const data=await response.json();
    if(!response.ok||data.success!==true){showError(data.message||'The recovery link could not be confirmed.');return;}
    showSuccess();
  }catch(e){showError('Unable to contact the verification service. Check your internet connection and try again.');}
}
verifyRecovery();
</script>
</body>
</html>
